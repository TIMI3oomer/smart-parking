services:

  - type: web
    name: smart-parking-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMBED_ALLOWED_ORIGINS
        sync: false

      - key: TRUST_PROXY
        value: "3"
      - key: OFFICE_ALLOWED_IPS
        sync: false

  - type: web
    name: smart-parking-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
